<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Skills</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f4f6;
            padding:40px;
        }

        .skills-box{
            max-width:800px;
            margin:auto;
            background:#ffffff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            border-left:6px solid #2563eb;
        }

        .skills-box h2{
            font-size:28px;
            color:#111827;
            margin-bottom:25px;
        }

        .skills-container{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }

        .skill{
            background:#2563eb;
            color:white;
            padding:12px 18px;
            border-radius:30px;
            font-size:16px;
            font-weight:500;
            transition:0.3s;
        }

        .skill:hover{
            transform:scale(1.05);
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="skills-box">

        <h2>Key Skills</h2>

        <div class="skills-container">
            <div class="skill">Python</div>
            <div class="skill">HTML5</div>
            <div class="skill">CSS3</div>
            <div class="skill">JavaScript</div>
            <div class="skill">SQL</div>
            <div class="skill">Web Development</div>
            <div class="skill">Database Management</div>
            <div class="skill">Problem Solving</div>
            <div class="skill">Git & GitHub</div>
            <div class="skill">Communication Skills</div>
            <div class="skill">Teamwork</div>
            <div class="skill">Analytical Thinking</div>
            <div class="skill">Quick Learning</div>
        </div>

    </div>

</body>
</html>
