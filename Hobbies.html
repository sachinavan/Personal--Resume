<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies & Interests</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f4f6;
            padding:40px;
        }

        .hobby-box{
            max-width:800px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            border-left:6px solid #2563eb;
        }

        .hobby-box h2{
            font-size:28px;
            color:#111827;
            margin-bottom:25px;
        }

        .hobby-list{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }

        .hobby{
            background:#e0e7ff;
            color:#1e3a8a;
            padding:12px 18px;
            border-radius:30px;
            font-size:16px;
            font-weight:500;
            transition:0.3s;
        }

        .hobby:hover{
            transform:scale(1.05);
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="hobby-box">

        <h2>Hobbies & Interests</h2>

        <div class="hobby-list">
            <div class="hobby">Programming & Coding</div>
            <div class="hobby">Learning New Technologies</div>
            <div class="hobby">Building Creative Projects</div>
            <div class="hobby">Problem Solving</div>
            <div class="hobby">Watching Tech Videos</div>
            <div class="hobby">Exploring AI Tools</div>
            <div class="hobby">Web Design</div>
            <div class="hobby">Reading About Technology</div>
            <div class="hobby">Content Creation & Vlogging</div>
            <div class="hobby">Continuous Self-Learning</div>
        </div>

    </div>

</body>
</html>
